server {
        listen 80;

        server_name _;

        # root /usr/share/nginx/html;
        root /usr/share/nginx/html/apps/web/dist;
        index index.html;

        # 集群 DNS（ACK CoreDNS）。运行时解析后端域名，避免后端未就绪时整份配置加载失败
        resolver 172.16.0.10 valid=10s;

        # SSE 实时推送：必须关闭缓冲，否则前端收不到事件
        location = /api/tickets/me/stream {
                set $api http://queue-poc-api.my.svc.cluster.local:3000;
                proxy_pass $api;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 1h;
                chunked_transfer_encoding off;
        }

        # 其余 API 同源反代到后端 Service（按需修改 namespace）
        location /api/ {
                set $api http://queue-poc-api.my.svc.cluster.local:3000;
                proxy_pass $api;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
                try_files $uri $uri/ /index.html;
        }
}
